[project]
name = "crossword-solver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "llama-index-llms-ollama>=0.9.1",
    "pandas>=3.0.2",
    "puzpy>=0.3.2",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["crossword_solver"]
